      send_instructions: "Riceverai tra pochi minuti un'email con le istruzioni per sbloccare il tuo account."
      send_paranoid_instructions: "Se il tuo account esiste, riceverai tra pochi minuti un'email con le istruzioni per sbloccarlo."
      unlocked: "Il tuo account è stato sbloccato. Effettua l'accesso per continuare."
  errors:
    messages:
      already_confirmed: "è già stata confermata, prova ad effettuare l'accesso"
      confirmation_period_expired: "deve essere confermata entro %{period}, richiedi un nuovo link"
      expired: "è scaduto, richiedine uno nuovo"
      not_found: "non trovato"
      not_locked: "non era bloccato"
      not_saved:
        one: "Un errore ha impedito il salvataggio di questo %{resource}:"
        other: "%{count} errori hanno impedito il salvataggio di questo %{resource}:"
